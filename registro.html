<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - Referencias</title>
  <link rel="icon" href="img/cita.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="siteHeader"></div>

  <main class="container">
    <section class="form-section">
      <h2>Crear cuenta</h2>
      <form id="registerForm" class="form" novalidate>
        <!-- Nombre completo -->
        <div class="form-row">
          <label for="fullName">Nombre completo <span class="required">*</span></label>
          <input type="text" id="fullName" name="fullName" required placeholder="Tu nombre completo">
        </div>

        <!-- Tipo de usuario (EJE PRINCIPAL) -->
        <div class="form-row" id="tipo-usuario-container">
          <label for="tipoUsuario">Tipo de usuario <span class="required">*</span></label>
          <select id="tipoUsuario" name="tipoUsuario" required>
            <option value="">Selecciona tu tipo</option>
            <option value="estudiante_universidad">Estudiante UnADM</option>
            <option value="estudiante_externo">Estudiante Externo</option>
            <option value="academico_universidad">Figura académica UnADM</option>
            <option value="externo">Usuario Externo</option>
          </select>
        </div>

        <!-- CASO A: Estudiante Universidad (nivel -> división -> programa + matricula) -->
        <div id="estudiante-universidad-container" style="display: none;">
          <div class="form-row" id="nivel-container">
            <label for="nivel">Nivel educativo <span class="required">*</span></label>
            <select id="nivel" name="nivel">
              <option value="">Selecciona un nivel</option>
            </select>
          </div>
          <div class="form-row" id="division-container" style="display: none;">
            <label for="division">División</label>
            <select id="division" name="division">
              <option value="">Selecciona una división</option>
            </select>
          </div>
          <div class="form-row" id="programa-container">
            <label for="programa">Programa educativo <span class="required">*</span></label>
            <select id="programa" name="programa" disabled>
              <option value="">Selecciona un programa</option>
            </select>
          </div>
          <div class="form-row" id="matricula-container">
            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" name="matricula" placeholder="Tu matrícula UnADM">
          </div>
        </div>

        <!-- CASO B: Estudiante Externo (nivel + programa texto libre) -->
        <div id="estudiante-externo-container" style="display: none;">
          <div class="form-row" id="nivel-externo-container">
            <label for="nivelExterno">Nivel educativo <span class="required">*</span></label>
            <select id="nivelExterno" name="nivelExterno">
              <option value="">Selecciona un nivel</option>
            </select>
          </div>
          <div class="form-row" id="programa-externo-container">
            <label for="programaExterno">Programa educativo <span class="required">*</span></label>
            <input type="text" id="programaExterno" name="programaExterno" placeholder="Ej: Ingeniería en Sistemas, Administración, etc.">
          </div>
        </div>

        <!-- CASO C: Académico Universidad (división estática + matricula opcional) -->
        <div id="academico-universidad-container" style="display: none;">
          <div class="form-row" id="division-academico-container">
            <label for="divisionAcademico">División <span class="required">*</span></label>
            <select id="divisionAcademico" name="divisionAcademico">
              <option value="">Selecciona una división</option>
            </select>
          </div>
          <div class="form-row" id="matricula-academico-container">
            <label for="matriculaAcademico">Matrícula (opcional)</label>
            <input type="text" id="matriculaAcademico" name="matriculaAcademico" placeholder="Tu matrícula UnADM">
          </div>
        </div>

        <!-- CASO D: Externo (sub-selector academico/usuario) -->
        <div id="externo-container" style="display: none;">
          <div class="form-row" id="tipo-externo-container">
            <label for="tipoExterno">¿Académico o usuario? <span class="required">*</span></label>
            <select id="tipoExterno" name="tipoExterno">
              <option value="">Selecciona</option>
              <option value="academico">Académico</option>
              <option value="usuario">Usuario</option>
            </select>
          </div>
          <!-- Sub-campos para académico externo -->
          <div id="externo-academico-container" style="display: none;">
            <div class="form-row">
              <label for="externoInstitucion">Institución (opcional)</label>
              <input type="text" id="externoInstitucion" name="externoInstitucion" placeholder="Ej: Universidad Nacional Autónoma de México">
            </div>
            <div class="form-row">
              <label for="externoDisciplina">Área o disciplina (opcional)</label>
              <input type="text" id="externoDisciplina" name="externoDisciplina" placeholder="Ej: Educación, Tecnología, etc.">
            </div>
          </div>
        </div>
        <div class="form-row">
          <label for="email">Correo electrónico <span class="required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="Ej. correo@nube.unadmexico.mx">
        </div>
        <div class="form-row">
          <label for="password">Contraseña <span class="required">*</span></label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-row">
          <label for="confirmPassword">Confirmar contraseña <span class="required">*</span></label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        <!-- Contenedor dinámico: contenido cargado desde /content/aviso-privacidad.md -->
        <div id="aviso-privacidad" class="markdown-container" style="height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;"></div>
        <div class="form-row privacy-consent">
          <input type="checkbox" id="privacyAgree" name="privacyAgree">
          <label for="privacyAgree">He leído y acepto la política de privacidad</label>
        </div>
        <div class="form-actions">
          <button type="submit" id="registerSubmitBtn" class="btn-primary" disabled>Registrarme</button>
        </div>
      </form>
      <p class="muted">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>2026, Posgrado UnADM</small>
    </div>
  </footer>

  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/registro.js"></script>
</body>
</html>
